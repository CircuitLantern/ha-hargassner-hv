# SPDX-License-Identifier: Apache-2.0
name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HVCLIENT_LIVE: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build 'setuptools>=77' ruff mypy
      - run: python -m pytest -q
      - run: python -m mypy -p hvclient
      - run: python -m ruff check --target-version py314 custom_components/hargassner_hv tests/ha tests/test_library_licensing.py tests/test_library_distribution.py tests/test_prepare_ha_dist.py tools/prepare_ha_dist.py
      - run: python -m build --no-isolation
      - run: python tools/prepare_ha_dist.py

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r tests/ha/requirements.txt
      - name: Require an environment without a standalone SDK
        run: python -c "import importlib.util; assert importlib.util.find_spec('hvclient') is None"
      - run: python tests/ha/run.py -q
