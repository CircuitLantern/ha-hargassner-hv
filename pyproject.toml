[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hargassner-hvclient"
version = "0.1.0"
description = "Independent async client for Hargassner telemetry, information and USER parameters"
readme = "docs/library.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "yarl>=1.17,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hvctl = "hvclient.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hvclient = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
