# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hargassner-hvclient"
version = "0.1.0"
description = "Independent async client for Hargassner telemetry, USER parameters, heating curves and circuit modes"
readme = "docs/library.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSING.md"]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "yarl>=1.17,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2", "setuptools>=77"]

[project.scripts]
hvctl = "hvclient.cli:main"

[tool.setuptools]
packages = ["hvclient"]
package-dir = {"" = "custom_components/hargassner_hv"}

[tool.setuptools.package-data]
hvclient = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["ha"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]
