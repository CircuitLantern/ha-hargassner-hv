set_circuit_program:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: hargassner_hv
    circuit:
      required: true
      selector:
        select:
          options: ["1", "2", "A"]
    kind:
      required: true
      selector:
        select:
          options: ["daily", "weekly"]
    program:
      required: true
      selector:
        object:
    expected:
      selector:
        object:
    preview_only:
      default: true
      selector:
        boolean:
